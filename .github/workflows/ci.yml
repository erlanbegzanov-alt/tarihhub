name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Lint, both type-checks (src *and* the api/ folder that tsconfig.app skips),
  # unit tests, and a real production build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run typecheck:api
      - run: npm test
      - run: npm run build

  # firestore.rules exercised against the emulator. Separate job because it
  # needs a JDK the build job has no use for.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run test:rules
